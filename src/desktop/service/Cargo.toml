[package]
name = "desktopctld"
version = "0.2.0"
edition = "2024"

[dependencies]
desktop-core = { package = "desktop-common", path = "../common" }
image = { version = "0.25", default-features = false, features = ["png"] }
interprocess = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
foreign-types = "0.5"
accessibility = "0.2"
accessibility-sys = "0.2"
block2 = "0.6"
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
dispatch2 = "0.3"
metal = "0.31"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = { version = "0.3", features = ["objc2"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace", "objc2"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSError", "NSString", "NSURL"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLTexture", "MTLResource", "MTLPixelFormat"] }
objc2-metal-performance-shaders = { version = "0.3", features = ["MPSCore", "MPSImageKernel", "MPSKernel"] }
objc2-screen-capture-kit = "0.3"
objc2-vision = { version = "0.3", features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "objc2-core-graphics"] }
tray-icon = "0.21"
unicode-normalization = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.21"
uiautomation = "0.24"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
leptess = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus foundation for portals, AT-SPI, and the GNOME extension client.
# Blocking API keeps the synchronous daemon model intact; async-only portal
# flows (ashpd) are driven via a block_on boundary.
zbus = { version = "5", features = ["blocking-api"] }
# XDG ScreenCast + RemoteDesktop portals. No pipewire feature here: portal
# negotiation is pure D-Bus; PipeWire fd consumption is a separate native layer.
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
# AT-SPI2 accessibility tree over session D-Bus.
atspi = { version = "0.26", features = ["proxies", "connection", "zbus"] }
# block_on boundary for async-only portal calls without making the daemon async.
futures-lite = "2"
# PipeWire frame ingestion for ScreenCast capture (needs libpipewire-0.3-dev).
pipewire = "0.8"
libspa = "0.8"
# EIS input emission. reis is a pure-Rust EIS implementation, avoiding the
# immature libei C bindings called out as the top risk in the spec.
reis = "0.4"
# Keymap handling for libei/EIS key events (needs libxkbcommon-dev).
xkbcommon = "0.8"
# Local OCR over captured frames (needs libtesseract-dev + leptonica).
leptess = "0.14"
